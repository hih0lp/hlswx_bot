# Тестовый контур (ТЗ 6.1): отдельная БД и токены, боевые чаты не затрагиваются.
# Прогон: docker compose -f docker-compose.test.yml run --rm tests
services:
  db_test:
    image: postgres:16-alpine
    container_name: hwls_db_test
    environment:
      POSTGRES_USER: hwls_test
      POSTGRES_PASSWORD: hwls_test
      POSTGRES_DB: hwls_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwls_test -d hwls_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  tests:
    build: .
    container_name: hwls_tests
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      # Тестовый токен нужен только для конструктора Bot — сеть не используется
      BOT_TOKEN: "123456789:AAHtest-token-for-local-tests-000000000"
      ADMIN_IDS: ""
      OWNER_IDS: ""
      DATABASE_URL: "postgresql+asyncpg://hwls_test:hwls_test@db_test:5432/hwls_test"
      REDIS_URL: "redis://localhost:6379/0"
      # Релей в тестах выключен: публикация идёт прямым каналом через FakeBot
      HAMMER_RELAY_ENABLED: "false"
      DIRECT_PUBLISH_FALLBACK: "true"
      HWLS_RELAY_SECRET: "test-secret"
      QUEUE_SILENCE_MINUTES: "20"
      QUEUE_USER_PAUSE_SEC: "120"
      QUEUE_JOB_TTL_MINUTES: "120"
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "pip install --no-cache-dir 'pytest>=8.3.3' 'pytest-asyncio>=0.26' >/dev/null &&
       pytest -v"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
