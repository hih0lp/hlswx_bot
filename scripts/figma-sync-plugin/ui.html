<style>
  body {
    margin: 0;
    padding: 16px;
    font: 12px/1.5 "Inter", system-ui, sans-serif;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { margin: 0 0 4px; font-size: 13px; }
  .totals { margin: 0 0 12px; color: #666; }
  .totals b { color: #1a1a1a; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    border-left: 3px solid #d9d9d9;
    background: #f5f5f5;
  }
  li.ok    { border-left-color: #14ae5c; }
  li.skip  { border-left-color: #a0a0a0; }
  li.fail  { border-left-color: #f24822; background: #fdeeec; }
  li.probe { border-left-color: #0d99ff; background: #eef6ff; }
  .where { color: #666; font-size: 11px; }
  .text  { font-family: ui-monospace, "SF Mono", Menlo, monospace; word-break: break-word; }
  /* Разведка печатает дерево кадра — его читают глазами, перенос строк ломает
     отступы, поэтому здесь свой блок с прокруткой. */
  li.probe .text { white-space: pre; overflow-x: auto; font-size: 11px; }
  .note  { color: #8a6d00; font-size: 11px; }
  button {
    margin-top: 12px; padding: 7px 16px; border: 0; border-radius: 6px;
    background: #0d99ff; color: #fff; font-size: 12px; cursor: pointer;
  }
  button.secondary { background: #e6e6e6; color: #1a1a1a; margin-right: 8px; }
</style>

<h1>Синхронизация подписей с ботом</h1>
<p class="totals" id="totals">Работаю…</p>
<ul id="rows"></ul>
<button id="dump" class="secondary" hidden>Скачать дамп макета</button>
<button id="close">Закрыть</button>

<script>
  document.getElementById("close").onclick = () => parent.postMessage({ pluginMessage: "close" }, "*");

  // Дамп страницы Flows — то, по чему сверяются бот и макет. Плагин снимает
  // его сам, потому что REST-API требует токена, а Figma MCP — квоты; без
  // этого дамп устаревал после каждого прогона, и сверка начинала врать.
  // Файл кладём в docs/design/figma.json (см. README плагина).
  const saveDump = (dump) => {
    const blob = new Blob([JSON.stringify(dump)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "figma.json";
    link.click();
    URL.revokeObjectURL(link.href);
  };

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    const totals = document.getElementById("totals");
    const rows = document.getElementById("rows");

    if (msg.type === "fatal") {
      totals.innerHTML = "Сорвалось: " + msg.message;
      return;
    }

    const r = msg.report;
    if (r.dump) {
      const button = document.getElementById("dump");
      button.hidden = false;
      button.onclick = () => saveDump(r.dump);
    }
    totals.innerHTML =
      "Изменено: <b>" + r.changed + "</b> · " +
      "уже совпадало: <b>" + r.already + "</b> · " +
      "не вышло: <b>" + r.failed + "</b>";

    // Тексты из макета выводим как есть, поэтому экранируем: иначе подпись
    // с «<» или «&» разъедет вёрстку отчёта.
    const escape = (value) =>
      String(value).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));

    rows.innerHTML = r.rows.map((row) => {
      const note = row.note ? '<div class="note">' + escape(row.note) + "</div>" : "";
      const by = row.foundBy === "тексту" ? '<div class="note">нода найдена по тексту — id в макете сменился</div>' : "";
      return (
        '<li class="' + row.state + '">' +
          '<div class="where">' + escape(row.where) + "</div>" +
          '<div class="text">' + escape(row.text) + "</div>" +
          note + by +
        "</li>"
      );
    }).join("");
  };
</script>
